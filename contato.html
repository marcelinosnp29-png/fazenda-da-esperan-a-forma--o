<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fale Conosco | Fazenda da Esperança Formação</title>
<meta name="description" content="Entre em contato com a Fazenda da Esperança Formação. Estamos prontos para ajudar você a começar sua jornada de aprendizado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #3b82f6;
    --secondary: #0ea5e9;
    --secondary-dark: #0284c7;
    --white: #ffffff;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;
    --success: #10b981;
    --error: #ef4444;
    --warning: #f59e0b;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 4px 6px rgba(0,0,0,.07);
    --shadow-md: 0 10px 25px rgba(0,0,0,.1);
    --shadow-lg: 0 20px 40px rgba(0,0,0,.12);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 20px;
    --transition: .3s ease;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--gray-800);
    background: var(--white);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-200);
    box-shadow: var(--shadow-sm);
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 70px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .logo-text { display: flex; flex-direction: column; }
  .logo-name {
    font-size: 15px;
    font-weight: 700;
    color: var(--gray-900);
    line-height: 1.2;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--primary);
    font-weight: 500;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  nav { display: flex; align-items: center; gap: 8px; }

  nav a {
    text-decoration: none;
    color: var(--gray-600);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    transition: var(--transition);
  }
  nav a:hover { color: var(--primary); background: var(--gray-100); }
  nav a.active { color: var(--primary); background: #eff6ff; font-weight: 600; }

  .btn-nav {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white) !important;
    padding: 9px 20px !important;
    border-radius: 50px !important;
    font-weight: 600 !important;
    box-shadow: 0 4px 12px rgba(37,99,235,.3);
    transition: var(--transition) !important;
  }
  .btn-nav:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37,99,235,.4) !important; background: var(--white) !important; color: var(--primary) !important; }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 6px;
    border-radius: var(--radius-sm);
    border: none;
    background: none;
    transition: var(--transition);
  }
  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--gray-700);
    border-radius: 2px;
    transition: var(--transition);
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-nav {
    display: none;
    flex-direction: column;
    background: var(--white);
    border-top: 1px solid var(--gray-200);
    padding: 16px 24px;
    gap: 4px;
  }
  .mobile-nav.open { display: flex; }
  .mobile-nav a {
    text-decoration: none;
    color: var(--gray-700);
    font-size: 15px;
    font-weight: 500;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    transition: var(--transition);
  }
  .mobile-nav a:hover, .mobile-nav a.active { color: var(--primary); background: #eff6ff; }

  /* ===== HERO BANNER ===== */
  .page-hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    padding: 80px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .page-hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 70%, rgba(255,255,255,.08) 0%, transparent 50%),
                radial-gradient(circle at 70% 30%, rgba(255,255,255,.06) 0%, transparent 50%);
    pointer-events: none;
  }
  .page-hero h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    color: var(--white);
    margin-bottom: 16px;
    position: relative;
  }
  .page-hero p {
    font-size: clamp(15px, 2vw, 18px);
    color: rgba(255,255,255,.85);
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  .breadcrumb {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 24px;
    position: relative;
  }
  .breadcrumb a, .breadcrumb span {
    font-size: 13px;
    color: rgba(255,255,255,.7);
    text-decoration: none;
  }
  .breadcrumb a:hover { color: var(--white); }
  .breadcrumb .sep { color: rgba(255,255,255,.4); }

  /* ===== MAIN CONTENT ===== */
  .contact-section {
    max-width: 1200px;
    margin: 0 auto;
    padding: 80px 24px;
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    gap: 60px;
    align-items: start;
  }

  /* ===== INFO COLUMN ===== */
  .contact-info h2 {
    font-size: 28px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 12px;
  }
  .contact-info > p {
    color: var(--gray-500);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 36px;
  }

  .info-cards { display: flex; flex-direction: column; gap: 16px; margin-bottom: 36px; }

  .info-card {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    background: var(--gray-50);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 20px;
    transition: var(--transition);
  }
  .info-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-2px); }

  .info-icon {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }
  .info-content h3 { font-size: 14px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
  .info-content p, .info-content a {
    font-size: 15px;
    font-weight: 500;
    color: var(--gray-800);
    text-decoration: none;
    line-height: 1.5;
  }
  .info-content a:hover { color: var(--primary); }

  /* Horários */
  .hours-card {
    background: linear-gradient(135deg, #eff6ff, #f0f9ff);
    border: 1px solid #bfdbfe;
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 36px;
  }
  .hours-card h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .hours-list { display: flex; flex-direction: column; gap: 10px; }
  .hours-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }
  .hours-day { color: var(--gray-600); font-weight: 500; }
  .hours-time { color: var(--gray-800); font-weight: 600; }
  .hours-badge {
    display: inline-block;
    background: var(--success);
    color: var(--white);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 50px;
  }
  .hours-badge.closed { background: var(--gray-400); }

  /* Social */
  .social-section h3 { font-size: 15px; font-weight: 600; color: var(--gray-700); margin-bottom: 12px; }
  .social-links { display: flex; gap: 12px; }
  .social-btn {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    text-decoration: none;
    transition: var(--transition);
    border: 1px solid var(--gray-200);
    background: var(--white);
  }
  .social-btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  .social-btn.wa { border-color: #25d366; }
  .social-btn.wa:hover { background: #25d366; }
  .social-btn.yt { border-color: #ff0000; }
  .social-btn.yt:hover { background: #ff0000; }
  .social-btn.ig { border-color: #e1306c; }
  .social-btn.ig:hover { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }

  /* ===== FORM COLUMN ===== */
  .contact-form-wrap {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius-lg);
    padding: 40px;
    box-shadow: var(--shadow-lg);
  }
  .contact-form-wrap h2 {
    font-size: 22px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 6px;
  }
  .contact-form-wrap > p {
    font-size: 14px;
    color: var(--gray-500);
    margin-bottom: 28px;
  }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }

  .form-group label {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-700);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .form-group label .req { color: var(--error); }

  .form-group input,
  .form-group select,
  .form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1.5px solid var(--gray-200);
    border-radius: var(--radius-sm);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--gray-800);
    background: var(--gray-50);
    transition: var(--transition);
    outline: none;
    appearance: none;
  }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    border-color: var(--primary);
    background: var(--white);
    box-shadow: 0 0 0 3px rgba(37,99,235,.1);
  }
  .form-group input.error,
  .form-group select.error,
  .form-group textarea.error {
    border-color: var(--error);
    box-shadow: 0 0 0 3px rgba(239,68,68,.1);
  }
  .form-group textarea { resize: vertical; min-height: 130px; }
  .form-group select { cursor: pointer; }

  .field-error { font-size: 12px; color: var(--error); display: none; }
  .field-error.show { display: block; }

  .char-count { font-size: 11px; color: var(--gray-400); text-align: right; margin-top: 2px; }

  .privacy-check {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 8px;
  }
  .privacy-check input[type="checkbox"] {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 1px;
    accent-color: var(--primary);
  }
  .privacy-check label {
    font-size: 13px;
    color: var(--gray-600);
    cursor: pointer;
    line-height: 1.5;
  }
  .privacy-check a { color: var(--primary); text-decoration: none; }
  .privacy-check a:hover { text-decoration: underline; }

  .btn-submit {
    width: 100%;
    padding: 15px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    font-family: 'Inter', sans-serif;
    font-size: 16px;
    font-weight: 700;
    border: none;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: var(--transition);
    margin-top: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 4px 15px rgba(37,99,235,.3);
    position: relative;
    overflow: hidden;
  }
  .btn-submit:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(37,99,235,.4); }
  .btn-submit:disabled { opacity: .7; cursor: not-allowed; transform: none; }

  .btn-submit .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,.4);
    border-top-color: var(--white);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    display: none;
  }
  .btn-submit.loading .spinner { display: block; }
  .btn-submit.loading .btn-text { display: none; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 100px;
    right: 24px;
    z-index: 9999;
    padding: 16px 24px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 500;
    color: var(--white);
    box-shadow: var(--shadow-lg);
    transform: translateX(120%);
    transition: transform .4s cubic-bezier(.175,.885,.32,1.275);
    max-width: 340px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--error); }

  /* ===== MAP ===== */
  .map-section { background: var(--gray-50); padding: 60px 24px; }
  .map-inner { max-width: 1200px; margin: 0 auto; }
  .map-inner h2 {
    font-size: 26px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 8px;
    text-align: center;
  }
  .map-inner > p {
    text-align: center;
    color: var(--gray-500);
    margin-bottom: 32px;
    font-size: 15px;
  }

  .map-placeholder {
    width: 100%;
    height: 380px;
    background: linear-gradient(135deg, #e0f2fe 0%, #eff6ff 100%);
    border-radius: var(--radius-lg);
    border: 2px dashed var(--gray-300);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    position: relative;
    overflow: hidden;
  }
  .map-placeholder::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%232563eb' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .map-icon { font-size: 56px; }
  .map-placeholder h3 { font-size: 20px; font-weight: 700; color: var(--primary); }
  .map-placeholder p { font-size: 14px; color: var(--gray-500); text-align: center; max-width: 300px; }
  .map-placeholder .map-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--primary);
    color: var(--white);
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: var(--transition);
    box-shadow: 0 4px 12px rgba(37,99,235,.3);
    margin-top: 8px;
  }
  .map-placeholder .map-btn:hover { background: var(--primary-dark); transform: translateY(-2px); }

  /* ===== FAQ ===== */
  .faq-section { max-width: 800px; margin: 0 auto; padding: 80px 24px; }
  .faq-section h2 {
    font-size: 26px;
    font-weight: 700;
    color: var(--gray-900);
    text-align: center;
    margin-bottom: 8px;
  }
  .faq-section > p { text-align: center; color: var(--gray-500); margin-bottom: 40px; }

  .faq-item {
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    transition: var(--transition);
  }
  .faq-item:hover { border-color: var(--primary); }
  .faq-question {
    width: 100%;
    background: none;
    border: none;
    padding: 20px 24px;
    text-align: left;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--gray-800);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    transition: var(--transition);
  }
  .faq-question:hover { color: var(--primary); background: var(--gray-50); }
  .faq-question.active { color: var(--primary); background: #eff6ff; }
  .faq-chevron { font-size: 18px; transition: transform .3s; flex-shrink: 0; }
  .faq-question.active .faq-chevron { transform: rotate(180deg); }
  .faq-answer {
    max-height: 0;
    overflow: hidden;
    transition: max-height .4s ease, padding .3s;
    padding: 0 24px;
  }
  .faq-answer.open { max-height: 200px; padding: 0 24px 20px; }
  .faq-answer p { font-size: 14px; color: var(--gray-600); line-height: 1.7; }

  /* ===== FOOTER ===== */
  footer {
    background: var(--gray-900);
    color: var(--gray-400);
    padding: 60px 24px 30px;
  }
  .footer-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 48px;
    margin-bottom: 48px;
  }
  .footer-brand .logo { margin-bottom: 16px; }
  .footer-brand .logo-name { color: var(--white); }
  .footer-brand p { font-size: 14px; line-height: 1.7; margin-bottom: 20px; }
  .footer-social { display: flex; gap: 10px; }
  .footer-social a {
    width: 38px;
    height: 38px;
    background: var(--gray-800);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    text-decoration: none;
    transition: var(--transition);
    border: 1px solid var(--gray-700);
  }
  .footer-social a:hover { background: var(--primary); border-color: var(--primary); transform: translateY(-2px); }

  .footer-col h4 { font-size: 14px; font-weight: 700; color: var(--white); margin-bottom: 16px; text-transform: uppercase; letter-spacing: .5px; }
  .footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .footer-col ul li a {
    font-size: 14px;
    color: var(--gray-400);
    text-decoration: none;
    transition: var(--transition);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .footer-col ul li a:hover { color: var(--white); padding-left: 4px; }

  .footer-bottom {
    max-width: 1200px;
    margin: 0 auto;
    padding-top: 24px;
    border-top: 1px solid var(--gray-800);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .footer-bottom p { font-size: 13px; }
  .footer-bottom-links { display: flex; gap: 20px; }
  .footer-bottom-links a { font-size: 13px; color: var(--gray-500); text-decoration: none; transition: var(--transition); }
  .footer-bottom-links a:hover { color: var(--white); }

  /* ===== WHATSAPP FLOAT ===== */
  .whatsapp-float {
    position: fixed;
    bottom: 28px;
    right: 28px;
    z-index: 999;
    width: 60px;
    height: 60px;
    background: #25d366;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(37,211,102,.4);
    transition: var(--transition);
    animation: pulse-wa 2.5s infinite;
  }
  .whatsapp-float:hover { transform: scale(1.1); box-shadow: 0 8px 28px rgba(37,211,102,.5); animation: none; }
  @keyframes pulse-wa {
    0%, 100% { box-shadow: 0 6px 20px rgba(37,211,102,.4); }
    50% { box-shadow: 0 6px 30px rgba(37,211,102,.7); }
  }
  .wa-tooltip {
    position: absolute;
    right: 70px;
    background: var(--gray-900);
    color: var(--white);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
