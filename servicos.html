<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nossos Serviços | Fazenda da Esperança Formação</title>
<meta name="description" content="Conheça todos os cursos online da Fazenda da Esperança Formação. Formação profissional de qualidade com certificado.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --secondary: #0ea5e9;
    --secondary-dark: #0284c7;
    --white: #ffffff;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -1px rgba(0,0,0,.06);
    --shadow-md: 0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -2px rgba(0,0,0,.05);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.1),0 10px 10px -5px rgba(0,0,0,.04);
    --shadow-xl: 0 25px 50px -12px rgba(0,0,0,.25);
    --radius: 12px;
    --radius-lg: 20px;
    --transition: all .3s ease;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; color: var(--gray-800); background: var(--white); line-height: 1.6; overflow-x: hidden; }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 1000;
    background: rgba(255,255,255,.97);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--gray-200);
    box-shadow: var(--shadow-sm);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 70px;
  }
  .logo { display: flex; align-items: center; gap: 12px; text-decoration: none; }
  .logo-icon {
    width: 44px; height: 44px; border-radius: 10px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: var(--white); font-weight: 800; flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
  .logo-name { font-size: 15px; font-weight: 700; color: var(--gray-900); }
  .logo-sub { font-size: 11px; font-weight: 500; color: var(--primary); letter-spacing: .5px; }
  nav { display: flex; align-items: center; gap: 8px; }
  nav a {
    text-decoration: none; color: var(--gray-600); font-size: 14px; font-weight: 500;
    padding: 8px 14px; border-radius: 8px; transition: var(--transition);
  }
  nav a:hover, nav a.active { color: var(--primary); background: rgba(37,99,235,.08); }
  .nav-cta {
    background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
    color: var(--white) !important; padding: 10px 20px !important; border-radius: 8px !important;
    font-weight: 600 !important; box-shadow: var(--shadow);
  }
  .nav-cta:hover { opacity: .9; transform: translateY(-1px); box-shadow: var(--shadow-md) !important; }
  .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; border-radius: 8px; transition: var(--transition); }
  .hamburger:hover { background: var(--gray-100); }
  .hamburger span { display: block; width: 24px; height: 2px; background: var(--gray-700); border-radius: 2px; transition: var(--transition); }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .mobile-nav {
    display: none; position: fixed; top: 70px; left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.98); backdrop-filter: blur(10px);
    z-index: 999; padding: 24px; flex-direction: column; gap: 8px;
    overflow-y: auto;
  }
  .mobile-nav.open { display: flex; }
  .mobile-nav a {
    text-decoration: none; color: var(--gray-700); font-size: 16px; font-weight: 500;
    padding: 14px 18px; border-radius: 10px; transition: var(--transition); border: 1px solid transparent;
  }
  .mobile-nav a:hover, .mobile-nav a.active { color: var(--primary); background: rgba(37,99,235,.08); border-color: rgba(37,99,235,.15); }
  .mobile-nav .nav-cta {
    background: linear-gradient(135deg, var(--primary), var(--secondary)) !important;
    color: var(--white) !important; text-align: center; border-color: transparent !important;
  }

  /* PAGE HERO */
  .page-hero {
    background: linear-gradient(135deg, var(--gray-900) 0%, var(--primary-dark) 50%, var(--secondary-dark) 100%);
    padding: 80px 24px; text-align: center; position: relative; overflow: hidden;
  }
  .page-hero::before {
    content: ''; position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='4'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .page-hero-inner { max-width: 700px; margin: 0 auto; position: relative; z-index: 1; }
  .page-hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2);
    color: var(--white); font-size: 13px; font-weight: 600; padding: 8px 18px;
    border-radius: 50px; margin-bottom: 24px; backdrop-filter: blur(10px);
  }
  .page-hero h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; color: var(--white); margin-bottom: 16px; line-height: 1.1; }
  .page-hero p { font-size: 18px; color: rgba(255,255,255,.8); max-width: 560px; margin: 0 auto; }

  /* BREADCRUMB */
  .breadcrumb {
    background: var(--gray-50); border-bottom: 1px solid var(--gray-200);
    padding: 14px 24px;
  }
  .breadcrumb-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .breadcrumb a { color: var(--primary); text-decoration: none; font-weight: 500; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb span { color: var(--gray-400); }
  .breadcrumb .current { color: var(--gray-600); }

  /* SECTION BASE */
  section { padding: 80px 24px; }
  .container { max-width: 1200px; margin: 0 auto; }
  .section-label {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(37,99,235,.08); color: var(--primary);
    font-size: 13px; font-weight: 700; padding: 8px 18px; border-radius: 50px;
    margin-bottom: 16px; letter-spacing: .5px; text-transform: uppercase;
  }
  .section-title { font-size: clamp(26px, 4vw, 40px); font-weight: 800; color: var(--gray-900); margin-bottom: 16px; line-height: 1.2; }
  .section-title span { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .section-desc { font-size: 17px; color: var(--gray-500); max-width: 600px; line-height: 1.7; }
  .section-header { text-align: center; margin-bottom: 60px; }
  .section-header .section-desc { margin: 0 auto; }

  /* STATS BAR */
  .stats-bar { background: linear-gradient(135deg, var(--primary), var(--secondary)); padding: 40px 24px; }
  .stats-inner { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; text-align: center; }
  .stat-item { color: var(--white); }
  .stat-number { font-size: 36px; font-weight: 800; display: block; line-height: 1; }
  .stat-label { font-size: 13px; font-weight: 500; opacity: .85; margin-top: 6px; }

  /* CATEGORIES */
  .categories-section { background: var(--gray-50); }
  .categories-grid { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 48px; }
  .cat-btn {
    padding: 10px 22px; border-radius: 50px; border: 2px solid var(--gray-200);
    background: var(--white); color: var(--gray-600); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px;
  }
  .cat-btn:hover, .cat-btn.active {
    border-color: var(--primary); color: var(--primary); background: rgba(37,99,235,.06);
  }
  .cat-btn .cat-count {
    background: var(--gray-200); color: var(--gray-600); font-size: 11px; font-weight: 700;
    padding: 2px 8px; border-radius: 50px; transition: var(--transition);
  }
  .cat-btn.active .cat-count, .cat-btn:hover .cat-count { background: var(--primary); color: var(--white); }

  /* SERVICES GRID */
  .services-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .service-card {
    background: var(--white); border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: var(--shadow); border: 1px solid var(--gray-100);
    transition: var(--transition); display: flex; flex-direction: column;
  }
  .service-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-xl); border-color: rgba(37,99,235,.2); }
  .service-card.featured { border: 2px solid var(--primary); position: relative; }
  .featured-badge {
    position: absolute; top: 16px; right: 16px; z-index: 2;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white); font-size: 11px; font-weight: 700; padding: 5px 12px; border-radius: 50px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .card-thumb {
    position: relative; height: 200px; overflow: hidden;
    background: linear-gradient(135deg, var(--gray-800), var(--gray-700));
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
  .service-card:hover .card-thumb img { transform: scale(1.05); }
  .card-thumb-placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    font-size: 56px;
  }
  .card-level {
    position: absolute; bottom: 12px; left: 12px;
    padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .5px;
  }
  .level-iniciante { background: rgba(34,197,94,.9); color: var(--white); }
  .level-intermediario { background: rgba(245,158,11,.9); color: var(--white); }
  .level-avancado { background: rgba(239,68,68,.9); color: var(--white); }
  .card-body { padding: 24px; flex: 1; display: flex; flex-direction: column; }
  .card-category { font-size: 12px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; }
  .card-title { font-size: 18px; font-weight: 700; color: var(--gray-900); margin-bottom: 10px; line-height: 1.3; }
  .card-desc { font-size: 14px; color: var(--gray-500); line-height: 1.6; margin-bottom: 16px; flex: 1; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .card-meta-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--gray-500); font-weight: 500; }
  .card-meta-item svg { color: var(--primary); flex-shrink: 0; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .card-tag {
    background: var(--gray-100); color: var(--gray-600); font-size: 11px; font-weight: 600;
    padding: 4px 10px; border-radius: 6px;
  }
  .card-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 16px; border-top: 1px solid var(--gray-100); }
  .card-price { display: flex; flex-direction: column; }
  .price-original { font-size: 12px; color: var(--gray-400); text-decoration: line-through; }
  .price-current { font-size: 22px; font-weight: 800; color: var(--gray-900); line-height: 1; }
  .price-current.free { color: #16a34a; }
  .price-period { font-size: 11px; color: var(--gray-400); }
  .card-btn {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white); text-decoration: none; font-size: 13px; font-weight: 700;
    padding: 10px 18px; border-radius: 8px; transition: var(--transition);
    white-space: nowrap;
  }
  .card-btn:hover { opacity: .9; transform: translateY(-1px); box-shadow: var(--shadow-md); }

  /* PROCESS SECTION */
  .process-section { background: var(--white); }
  .process-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; position: relative; }
  .process-steps::before {
    content: ''; position: absolute; top: 36px; left: calc(12.5% + 20px); right: calc(12.5% + 20px);
    height: 2px; background: linear-gradient(90deg, var(--primary), var(--secondary));
    z-index: 0;
  }
  .process-step { text-align: center; position: relative; z-index: 1; }
  .step-number {
    width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 20px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; font-weight: 800; color: var(--white);
    box-shadow: 0 8px 20px rgba(37,99,235,.3);
    position: relative;
  }
  .step-icon { font-size: 28px; }
  .step-title { font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
  .step-desc { font-size: 14px; color: var(--gray-500); line-height: 1.6; }

  /* FEATURED COURSE */
  .featured-section { background: var(--gray-50); }
  .featured-course {
    background: var(--white); border-radius: var(--radius-lg); overflow: hidden;
    box-shadow: var(--shadow-lg); border: 1px solid var(--gray-100);
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
  }
  .featured-video { position: relative; background: var(--gray-900); min-height: 360px; }
  .featured-video iframe { width: 100%; height: 100%; border: none; display: block; }
  .featured-video-placeholder {
    width: 100%; height: 100%; min-height: 360px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--gray-900), var(--primary-dark));
    color: var(--white); gap: 16px;
  }
  .play-btn {
    width: 72px; height: 72px; border-radius: 50%;
    background: rgba(255,255,255,.2); border: 3px solid rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    cursor: pointer; transition: var(--transition);
  }
  .play-btn:hover { background: rgba(255,255,255,.3); transform: scale(1.1); }
  .featured-info { padding: 40px; display: flex; flex-direction: column; justify-content: center; }
  .featured-info .section-label { margin-bottom: 12px; }
  .featured-info h3 { font-size: 26px; font-weight: 800; color: var(--gray-900); margin-bottom: 12px; line-height: 1.3; }
  .featured-info p { font-size: 15px; color: var(--gray-500); line-height: 1.7; margin-bottom: 24px; }
  .featured-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
  .featured-list li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--gray-700); font-weight: 500; }
  .featured-list li::before { content: '✓'; color: var(--primary); font-weight: 800; font-size: 16px; }
  .featured-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white); text-decoration: none; font-size: 15px; font-weight: 700;
    padding: 14px 28px; border-radius: 10px; transition: var(--transition);
    box-shadow: var(--shadow);
  }
  .btn-primary:hover { opacity: .9; transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .btn-outline {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: var(--primary);
    border: 2px solid var(--primary); text-decoration: none;
    font-size: 15px; font-weight: 700; padding: 12px 24px; border-radius: 10px; transition: var(--transition);
  }
  .btn-outline:hover { background: rgba(37,99,235,.06); transform: translateY(-2px); }

  /* PRICING */
  .pricing-section { background: var(--white); }
  .pricing-toggle { display: flex; align-items: center; justify-content: center; gap: 16px; margin-bottom: 48px; }
  .pricing-toggle span { font-size: 15px; font-weight: 600; color: var(--gray-600); }
  .toggle-switch {
    width: 52px; height: 28px; background: var(--primary); border-radius: 50px;
    position: relative; cursor: pointer; transition: var(--transition);
  }
  .toggle-switch::after {
    content: ''; position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%; background: var(--white);
    transition: var(--transition);
  }
  .toggle-switch.annual::after { transform: translateX(24px); }
  .discount-badge { background: #dcfce7; color: #16a34a; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 50px; }
  .pricing-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
  .pricing-card {
    background: var(--white); border-radius: var(--radius-lg); padding: 36px;
    border: 2px solid var(--gray-200); transition: var(--transition); position: relative;
  }
  .pricing-card:hover { border-color: var(--primary); box-shadow: var(--shadow-lg); transform: translateY(-4px); }
  .pricing-card.popular { border-color: var(--primary); box-shadow: var(--shadow-lg); }
  .popular-tag {
    position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white); font-size: 12px; font-weight: 700; padding: 6px 20px; border-radius: 50px;
    white-space: nowrap;
  }
  .plan-icon { font-size: 40px; margin-bottom: 16px; }
  .plan-name { font-size: 20px; font-weight: 800; color: var(--gray-900); margin-bottom: 8px; }
  .plan-desc { font-size: 14px; color: var(--gray-500); margin-bottom: 24px; line-height: 1.6; }
  .plan-price { margin-bottom: 28px; }
  .plan-price .amount { font-size: 42px; font-weight: 800; color: var(--gray-900); line-height: 1; }
  .plan-price .currency { font-size: 20px; font-weight: 700; vertical-align: top; margin-top: 8px; display: inline-block; }
  .plan-price .period { font-size: 14px; color: var(--gray-400); }
  .plan-features { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-bottom: 28px; }
  .plan-features li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--gray-700); }
  .feat-check { color: #16a34a; font-weight: 800; font-size: 16px; }
  .feat-x { color: var(--gray-300); font-size: 16px; }
  .plan-btn {
    width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; border: none; transition: var(--transition); text-decoration: none;
    display: block; text-align: center;
  }
  .plan-btn-primary { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: var(--white); box-shadow: var(--shadow); }
  .plan-btn-primary:hover { opacity: .9; transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .plan-btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
  .plan-btn-outline:hover { background: rgba(37,99,235,.06); transform: translateY(-2px); }

  /* TESTIMONIALS */
  .testimonials-section { background: var(--gray-50); }
  .testimonials-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .testimonial-card {
    background: var(--white); border-radius: var(--radius); padding: 28px;
    box-shadow: var(--shadow); border: 1px solid var(--gray-100); transition: var(--transition);
  }
  .testimonial-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
  .testimonial-stars { color: #f59e0b; font-size: 16px; margin-bottom: 14px; letter-spacing: 2px; }
  .testimonial-text { font-size: 14px; color: var(--gray-600); line-height: 1.7; margin-bottom: 20px; font-style: italic; }
  .testimonial-author { display: flex; align-items: center; gap: 12px; }
  .author-avatar {
    width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex; align-items: center; justify-content: center;
    color: var(--white); font-size: 16px; font-weight: 700;
  }
  .author-name { font-size: 14px; font-weight: 700; color: var(--gray-900); }
  .author-role { font-size: 12px; color: var(--gray-400); }
  .author-course { font-size: 11px; color: var(--primary); font-weight: 600; margin-top: 2px; }

  /* FAQ */
  .faq-section { background: var(--white); }
  .faq-container { max-width: 800px; margin: 0 auto; }
  .faq-item { border: 1px solid var(--gray-200); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; transition: var(--transition); }
  .faq-item:hover { border-color: var(--primary); }
  .faq-item.open { border-color: var(--primary); box-shadow: var(--shadow); }
  .faq-question {
    width: 100%; padding: 20px 24px; background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    text-align: left; transition: var(--transition);
  }
  .faq-question:hover { background: var(--gray-50); }
  .faq-item.open .faq-question { background: rgba(37,99,235,.04); }
  .faq-q-text { font-size: 15px; font-weight: 600; color: var(--gray-800); line-height: 1.4; }
  .faq-item.open .faq-q-text { color: var(--primary); }
  .faq-icon {
    width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
    background: var(--gray-100); display: flex; align-items: center; justify-content: center;
