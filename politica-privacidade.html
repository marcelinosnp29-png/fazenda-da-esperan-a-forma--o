<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Política de Privacidade da Fazenda da Esperança Formação - Cursos Online. Saiba como tratamos seus dados pessoais conforme a LGPD.">
    <meta name="robots" content="index, follow">
    <title>Política de Privacidade | Fazenda da Esperança Formação</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --secondary: #0ea5e9;
            --secondary-dark: #0284c7;
            --white: #ffffff;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-200: #e2e8f0;
            --gray-300: #cbd5e1;
            --gray-400: #94a3b8;
            --gray-500: #64748b;
            --gray-600: #475569;
            --gray-700: #334155;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
            --radius: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --transition: all 0.3s ease;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--gray-800);
            background-color: var(--white);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== HEADER ========== */
        header {
            background: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid var(--primary);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 72px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--white);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-name {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.2;
        }

        .logo-tagline {
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        nav a {
            text-decoration: none;
            color: var(--gray-600);
            font-size: 0.875rem;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: var(--radius);
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--primary);
            background: var(--gray-100);
        }

        .btn-nav-cta {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--white) !important;
            padding: 10px 20px !important;
            border-radius: var(--radius) !important;
            font-weight: 600 !important;
            transition: var(--transition) !important;
            box-shadow: var(--shadow-sm);
        }

        .btn-nav-cta:hover {
            transform: translateY(-1px);
            box-shadow: var(--shadow-md) !important;
            background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark)) !important;
            color: var(--white) !important;
        }

        .hamburger {
            display: none;
            flex-direction: column;
            gap: 5px;
            cursor: pointer;
            padding: 8px;
            border-radius: var(--radius);
            transition: var(--transition);
            background: none;
            border: none;
        }

        .hamburger:hover {
            background: var(--gray-100);
        }

        .hamburger span {
            display: block;
            width: 24px;
            height: 2px;
            background: var(--gray-700);
            border-radius: 2px;
            transition: var(--transition);
        }

        /* ========== PAGE HERO ========== */
        .page-hero {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            padding: 64px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .page-hero::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
            animation: pulse 8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .page-hero-content {
            position: relative;
            z-index: 1;
            max-width: 800px;
            margin: 0 auto;
        }

        .page-hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: var(--white);
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .page-hero h1 {
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 800;
            color: var(--white);
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .page-hero p {
            font-size: 1.05rem;
            color: rgba(255,255,255,0.85);
            max-width: 600px;
            margin: 0 auto 24px;
        }

        .vigencia-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: var(--white);
            padding: 10px 20px;
            border-radius: 100px;
            font-size: 0.875rem;
            font-weight: 600;
            backdrop-filter: blur(10px);
        }

        .vigencia-badge svg {
            width: 16px;
            height: 16px;
            fill: var(--white);
        }

        /* ========== BREADCRUMB ========== */
        .breadcrumb {
            background: var(--gray-50);
            border-bottom: 1px solid var(--gray-200);
            padding: 12px 24px;
        }

        .breadcrumb-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.825rem;
            color: var(--gray-500);
        }

        .breadcrumb a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .breadcrumb a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .breadcrumb-sep {
            color: var(--gray-300);
        }

        .breadcrumb-current {
            color: var(--gray-700);
            font-weight: 500;
        }

        /* ========== MAIN LAYOUT ========== */
        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 60px 24px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 48px;
            align-items: start;
        }

        /* ========== SIDEBAR / SUMÁRIO ========== */
        .sidebar {
            position: sticky;
            top: 100px;
        }

        .toc-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-xl);
            padding: 28px;
            box-shadow: var(--shadow);
        }

        .toc-title {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--gray-900);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toc-title svg {
            width: 16px;
            height: 16px;
            fill: var(--primary);
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .toc-list li a {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--gray-600);
            font-size: 0.825rem;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: var(--radius);
            transition: var(--transition);
            border-left: 2px solid transparent;
        }

        .toc-list li a:hover {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.06);
            border-left-color: var(--primary);
        }

        .toc-num {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: var(--gray-100);
            border-radius: 50%;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--gray-500);
            flex-shrink: 0;
            transition: var(--transition);
        }

        .toc-list li a:hover .toc-num {
            background: var(--primary);
            color: var(--white);
        }

        .dpo-card {
            margin-top: 20px;
            background: linear-gradient(135deg, rgba(37,99,235,0.06), rgba(14,165,233,0.06));
            border: 1px solid rgba(37,99,235,0.2);
            border-radius: var(--radius-xl);
            padding: 24px;
        }

        .dpo-card-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dpo-card-title svg {
            width: 14px;
            height: 14px;
            fill: var(--primary);
        }

        .dpo-card p {
            font-size: 0.8rem;
            color: var(--gray-600);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .dpo-card a {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-size: 0.775rem;
            font-weight: 600;
            text-decoration: none;
            word-break: break-all;
            transition: var(--transition);
        }

        .dpo-card a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        .dpo-card a svg {
            width: 12px;
            height: 12px;
            fill: var(--primary);
            flex-shrink: 0;
        }

        /* ========== CONTENT AREA ========== */
        .content-area {
            min-width: 0;
        }

        /* ========== ALERT BANNER ========== */
        .alert-banner {
            background: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(14,165,233,0.08));
            border: 1px solid rgba(37,99,235,0.25);
            border-left: 4px solid var(--primary);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin-bottom: 40px;
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .alert-banner svg {
            width: 22px;
            height: 22px;
            fill: var(--primary);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .alert-banner-text h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 6px;
        }

        .alert-banner-text p {
            font-size: 0.85rem;
            color: var(--gray-600);
            line-height: 1.6;
        }

        .alert-banner-text a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .alert-banner-text a:hover {
            text-decoration: underline;
        }

        /* ========== SECTIONS ========== */
        .policy-section {
            margin-bottom: 52px;
            scroll-margin-top: 100px;
        }

        .section-header {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--gray-100);
        }

        .section-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .section-icon svg {
            width: 24px;
            height: 24px;
            fill: var(--white);
        }

        .section-header-text h2 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--gray-900);
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .section-header-text .section-subtitle {
            font-size: 0.825rem;
            color: var(--gray-500);
            font-weight: 500;
        }

        .policy-section p {
            font-size: 0.95rem;
            color: var(--gray-600);
            line-height: 1.8;
            margin-bottom: 16px;
        }

        .policy-section p:last-child {
            margin-bottom: 0;
        }

        .policy-section strong {
            color: var(--gray-800);
            font-weight: 600;
        }

        /* ========== INFO CARDS ========== */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .info-card {
            background: var(--gray-50);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: var(--transition);
        }

        .info-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }

        .info-card-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .info-card-icon svg {
            width: 18px;
            height: 18px;
            fill: var(--white);
        }

        .info-card h4 {
            font-size: 0.875rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 6px;
        }

        .info-card p {
            font-size: 0.8rem;
            color: var(--gray-500);
            line-height: 1.5;
            margin-bottom: 0 !important;
        }

        /* ========== LISTS ========== */
        .policy-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 16px 0;
        }

        .policy-list li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.925rem;
            color: var(--gray-600);
            line-height: 1.6;
        }

        .policy-list li::before {
            content: '';
            display: block;
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 50%;
            margin-top: 7px;
            flex-shrink: 0;
        }

        .policy-list li strong {
            color: var(--gray-800);
            font-weight: 600;
        }

        /* ========== RIGHTS GRID (Art. 18) ========== */
        .rights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin: 24px 0;
        }

        .right-card {
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .right-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .right-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-3px);
        }

        .right-card-num {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
        }

        .right-card h4 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--gray-800);
            margin-bottom: 8px;
        }

        .right-card p {
            font-size: 0.8rem;
            color: var(--gray-500);
            line-height: 1.5;
            margin-bottom: 0 !important;
        }

        /* ========== TABLE ========== */
        .table-wrapper {
            overflow-x: auto;
            border-radius: var(--radius-lg);
            border: 1px solid var(--gray-200);
            margin: 24px 0;
            box-shadow: var(--shadow-sm);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }

        thead {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        thead th {
            padding: 14px 18px;
            text-align: left;
            color: var(--white);
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid var(--gray-100);
            transition: var(--transition);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody tr:hover {
            background: rgba(37, 99, 235, 0.03);
        }

        tbody td {
            padding: 14px 18px;
            color: var(--gray-600);
            line-height: 1.5;
            vertical-align: top;
        }

        tbody td:first-child {
            font-weight: 600;
            color: var(--gray-800);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge-blue {
            background: rgba(37,99,235,0.1);
            color: var(--primary);
        }

        .badge-green {
            background: rgba(16,185,129,0.1);
            color: var(--success);
        }

        .badge-yellow {
            background: rgba(245,158,11,0.1);
            color: var(--warning);
        }

        .badge-sky {
            background: rgba(14,165,233,0.1);
            color: var(--secondary-dark);
        }

        /* ========== HIGHLIGHT BOX ========== */
        .highlight-box {
            background: linear-gradient(135deg, rgba(37,99,235,0.06), rgba(14,165,233,0.06));
            border: 1px solid rgba(37,99,235,0.2);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin: 24px 0;
        }

        .highlight-box h4 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .highlight-box h4 svg {
            width: 16px;
            height: 16px;
            fill: var(--primary);
        }

        .highlight-box p {
            font-size: 0.875rem;
            color: var(--gray-600);
            line-height: 1.7;
            margin-bottom: 0 !important;
        }

        .highlight-box a {
            color: var(--primary);
            font-weight: 600;
            text-decoration: none;
        }

        .highlight-box a:hover {
            text-decoration: underline;
        }

        /* ========== WARNING BOX ========== */
        .warning-box {
            background: rgba(245,158,11,0.06);
            border: 1px solid rgba(245,158,11,0.3);
            border-left: 4px solid var(--warning);
            border-radius: var(--radius-lg);
            padding: 20px 24px;
            margin: 24px 0;
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }

        .warning-box svg {
            width: 20px;
            height: 20px;
            fill: var(--warning);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .warning-box p {
            font-size: 0.875rem;
            color: var(--gray-600);
            line-height: 1.6;
            margin-bottom: 0 !important;
        }

        .warning-box strong {
            color: var(--gray-800);
        }

        /* ========== DIVIDER ========== */
        .section-divider {
            height: 1px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), transparent);
            margin: 52px 0;
            opacity: 0.3;
        }

        /* ========== CONTACT SECTION ========== */
        .contact-section {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            border-radius: var(--radius-xl);
            padding: 48px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 52px;
        }

        .contact-section::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -10%;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .contact-section::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -5%;
            width: 200px;
            height: 200px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
        }

        .contact-section-inner {
            position: relative;
            z-index: 1;
        }

        .contact-section h2 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 12px;
        }

        .contact-section p {
            font-size: 1rem;
            color: rgba(255,255,255,0.85);
            margin-bottom: 32px;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
