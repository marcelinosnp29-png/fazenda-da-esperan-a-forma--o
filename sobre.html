<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobre Nós | Fazenda da Esperança Formação</title>
<meta name="description" content="Conheça a história, missão, visão e valores da Fazenda da Esperança Formação. Transformando vidas através da educação online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --primary-light: #3b82f6;
    --secondary: #0ea5e9;
    --secondary-dark: #0284c7;
    --white: #ffffff;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
    --shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -1px rgba(0,0,0,.06);
    --shadow-md: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04);
    --shadow-xl: 0 25px 50px -12px rgba(0,0,0,.25);
    --radius: 12px;
    --radius-lg: 20px;
    --radius-xl: 32px;
    --transition: all .3s cubic-bezier(.4,0,.2,1);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--gray-800);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: rgba(255,255,255,.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-200);
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
  }

  header.scrolled {
    box-shadow: var(--shadow-md);
  }

  .header-inner {
    max-width: 1280px;
    margin: 0 auto;
    padding: 0 24px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    flex-shrink: 0;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(37,99,235,.35);
  }

  .logo-text { display: flex; flex-direction: column; line-height: 1.2; }
  .logo-name { font-size: 15px; font-weight: 800; color: var(--gray-900); letter-spacing: -.3px; }
  .logo-sub { font-size: 11px; font-weight: 500; color: var(--primary); letter-spacing: .5px; text-transform: uppercase; }

  nav { display: flex; align-items: center; gap: 4px; }

  nav a {
    text-decoration: none;
    color: var(--gray-600);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    transition: var(--transition);
    white-space: nowrap;
  }

  nav a:hover { color: var(--primary); background: var(--gray-100); }
  nav a.active { color: var(--primary); background: rgba(37,99,235,.08); font-weight: 600; }

  .header-cta {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .btn-header {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    text-decoration: none;
    padding: 10px 22px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    transition: var(--transition);
    box-shadow: 0 4px 12px rgba(37,99,235,.3);
    white-space: nowrap;
  }

  .btn-header:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(37,99,235,.4);
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 8px;
    border-radius: 8px;
    transition: var(--transition);
    background: none;
    border: none;
  }

  .hamburger:hover { background: var(--gray-100); }

  .hamburger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--gray-700);
    border-radius: 2px;
    transition: var(--transition);
  }

  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-menu {
    display: none;
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    background: rgba(255,255,255,.98);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gray-200);
    box-shadow: var(--shadow-lg);
    z-index: 999;
    padding: 16px 24px 24px;
    flex-direction: column;
    gap: 4px;
    transform: translateY(-10px);
    opacity: 0;
    transition: var(--transition);
  }

  .mobile-menu.open {
    display: flex;
    transform: translateY(0);
    opacity: 1;
  }

  .mobile-menu a {
    text-decoration: none;
    color: var(--gray-700);
    font-size: 15px;
    font-weight: 500;
    padding: 12px 16px;
    border-radius: 10px;
    transition: var(--transition);
  }

  .mobile-menu a:hover { color: var(--primary); background: var(--gray-100); }
  .mobile-menu a.active { color: var(--primary); background: rgba(37,99,235,.08); font-weight: 600; }

  .mobile-menu .btn-mobile {
    margin-top: 8px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    text-align: center;
    padding: 14px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 15px;
    box-shadow: 0 4px 12px rgba(37,99,235,.3);
  }

  /* ===== HERO SOBRE ===== */
  .about-hero {
    background: linear-gradient(135deg, var(--gray-900) 0%, #1e3a5f 50%, var(--primary-dark) 100%);
    padding: 100px 24px 80px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .about-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Ccircle cx='30' cy='30' r='2'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }

  .about-hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: var(--white);
    clip-path: ellipse(55% 100% at 50% 100%);
  }

  .about-hero .container { position: relative; z-index: 1; max-width: 800px; margin: 0 auto; }

  .hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    color: var(--white);
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 24px;
    backdrop-filter: blur(8px);
  }

  .about-hero h1 {
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 900;
    color: var(--white);
    line-height: 1.1;
    letter-spacing: -1.5px;
    margin-bottom: 20px;
  }

  .about-hero h1 span {
    background: linear-gradient(90deg, #60a5fa, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .about-hero p {
    font-size: 18px;
    color: rgba(255,255,255,.75);
    max-width: 600px;
    margin: 0 auto 40px;
    line-height: 1.7;
  }

  .hero-stats {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
  }

  .hero-stat { text-align: center; }

  .hero-stat-number {
    font-size: 36px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: -1px;
    line-height: 1;
  }

  .hero-stat-label {
    font-size: 13px;
    color: rgba(255,255,255,.6);
    font-weight: 500;
    margin-top: 4px;
  }

  /* ===== CONTAINERS ===== */
  .container { max-width: 1280px; margin: 0 auto; padding: 0 24px; }
  .section { padding: 96px 0; }
  .section-sm { padding: 64px 0; }

  .section-label {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(37,99,235,.08);
    color: var(--primary);
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    color: var(--gray-900);
    letter-spacing: -1px;
    line-height: 1.2;
    margin-bottom: 16px;
  }

  .section-title span {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .section-desc {
    font-size: 17px;
    color: var(--gray-500);
    line-height: 1.7;
    max-width: 600px;
  }

  /* ===== HISTÓRIA ===== */
  .history-section { background: var(--white); }

  .history-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }

  .history-content {}

  .history-text {
    font-size: 16px;
    color: var(--gray-600);
    line-height: 1.8;
    margin-bottom: 20px;
  }

  .history-text strong { color: var(--gray-800); font-weight: 700; }

  .history-highlight {
    background: linear-gradient(135deg, rgba(37,99,235,.06), rgba(14,165,233,.06));
    border-left: 4px solid var(--primary);
    padding: 20px 24px;
    border-radius: 0 12px 12px 0;
    margin: 28px 0;
    font-size: 17px;
    font-style: italic;
    color: var(--gray-700);
    line-height: 1.7;
  }

  .history-image-wrap {
    position: relative;
  }

  .history-image-main {
    width: 100%;
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-xl);
    display: block;
    aspect-ratio: 4/3;
    object-fit: cover;
  }

  .history-image-badge {
    position: absolute;
    bottom: -20px;
    left: -20px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    padding: 20px 24px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    text-align: center;
  }

  .history-image-badge .num {
    font-size: 32px;
    font-weight: 900;
    line-height: 1;
    letter-spacing: -1px;
  }

  .history-image-badge .lbl {
    font-size: 12px;
    font-weight: 600;
    opacity: .85;
    margin-top: 4px;
  }

  .history-image-accent {
    position: absolute;
    top: -16px;
    right: -16px;
    width: 80px;
    height: 80px;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    box-shadow: var(--shadow-lg);
  }

  /* ===== MISSÃO VISÃO VALORES ===== */
  .mvv-section { background: var(--gray-50); }

  .mvv-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .mvv-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 40px 32px;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    transition: var(--transition);
    position: relative;
    overflow: hidden;
  }

  .mvv-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    transform: scaleX(0);
    transition: var(--transition);
    transform-origin: left;
  }

  .mvv-card:hover::before { transform: scaleX(1); }
  .mvv-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-xl); }

  .mvv-icon {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 24px;
  }

  .mvv-icon.blue { background: rgba(37,99,235,.1); }
  .mvv-icon.cyan { background: rgba(14,165,233,.1); }
  .mvv-icon.green { background: rgba(16,185,129,.1); }

  .mvv-card h3 {
    font-size: 22px;
    font-weight: 800;
    color: var(--gray-900);
    margin-bottom: 12px;
    letter-spacing: -.5px;
  }

  .mvv-card p {
    font-size: 15px;
    color: var(--gray-500);
    line-height: 1.7;
  }

  .values-list {
    list-style: none;
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .values-list li {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 14px;
    color: var(--gray-600);
    line-height: 1.5;
  }

  .values-list li::before {
    content: '✦';
    color: var(--primary);
    font-size: 10px;
    margin-top: 4px;
    flex-shrink: 0;
  }

  /* ===== TIMELINE ===== */
  .timeline-section { background: var(--white); }

  .timeline {
    position: relative;
    max-width: 900px;
    margin: 0 auto;
  }

  .timeline::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 0;
    bottom: 0;
    width: 2px;
    background: linear-gradient(180deg, var(--primary), var(--secondary));
    transform: translateX(-50%);
  }

  .timeline-item {
    display: grid;
    grid-template-columns: 1fr 60px 1fr;
    gap: 0;
    margin-bottom: 48px;
    position: relative;
  }

  .timeline-item:last-child { margin-bottom: 0; }

  .timeline-content {
    background: var(--white);
    border: 1px solid var(--gray-200);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow);
    transition: var(--transition);
  }

  .timeline-content:hover { box-shadow: var(--shadow-lg); transform: translateY(-3px); }

  .timeline-item:nth-child(odd) .timeline-content { grid-column: 1; }
  .timeline-item:nth-child(odd) .timeline-empty { grid-column: 3; }
  .timeline-item:nth-child(even) .timeline-content { grid-column: 3; order: 3; }
  .timeline-item:nth-child(even) .timeline-empty { grid-column: 1; order: 1; }

  .timeline-dot {
    grid-column: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  .timeline-dot-inner {
    width: 48px;
    height: 48px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-weight: 800;
    font-size: 13px;
    box-shadow: 0 0 0 4px rgba(37,99,235,.15), var(--shadow);
    flex-shrink: 0;
  }

  .timeline-year {
    font-size: 12px;
    font-weight: 700;
    color: var(--primary);
    letter-spacing: .5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .timeline-content h4 {
    font-size: 17px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 8px;
    letter-spacing: -.3px;
  }

  .timeline-content p {
    font-size: 14px;
    color: var(--gray-500);
    line-height: 1.6;
  }

  /* ===== EQUIPE ===== */
  .team-section { background: var(--gray-50); }

  .team-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 28px;
  }

  .team-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
    transition: var(--transition);
    text-align: center;
  }

  .team-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); }

  .team-card-img {
    position: relative;
    overflow: hidden;
  }

  .team-card-img img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    transition: var(--transition);
  }

  .team-card:hover .team-card-img img { transform: scale(1.05); }

  .team-card-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(37,99,235,.8) 100%);
    opacity: 0;
    transition: var(--transition);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 16px;
    gap: 12px;
  }

  .team-card:hover .team-card-overlay { opacity: 1; }

  .team-social-btn {
    width: 36px;
    height: 36px;
    background: rgba(255,255,255,.2);
    border: 1px solid rgba(255,255,255,.3);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 14px;
    text-decoration: none;
    transition: var(--transition);
    backdrop-filter: blur(4px);
  }

  .team-social-btn:hover { background: var(--white); color: var(--primary); }

  .team-card-info { padding: 24px 20px; }

  .team-card-info h4 {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 4px;
    letter-spacing: -.3px;
  }

  .team-card-role {
    font-size: 13px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 10px;
  }

  .team-card-bio {
    font-size: 13px;
    color: var(--gray-500);
    line-height: 1.5;
  }

  /* ===== NÚMEROS ===== */
  .numbers-section {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    padding: 80px 0;
  }

  .numbers-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 40px;
    text-align: center;
  }

  .number-item {}

  .number-value {
    font-size: 52px;
    font-weight: 900;
    color: var(--white);
    letter-spacing: -2px;
    line-height: 1;
    margin-bottom: 8px;
  }

  .number-label {
    font-size: 15px;
    color: rgba(255,255,255,.75);
    font-weight: 500;
  }

  .number-icon {
    font-size: 32px;
    margin-bottom: 12px;
    display: block;
  }

  /* ===== DIFERENCIAIS ===== */
  .diff-section { background: var(--white); }

  .diff-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 28px;
  }

  .diff-card {
    padding: 32px;
    border-radius: var(--radius);
    border: 1px solid var(--gray-200);
    transition: var(--transition);
    display: flex;
    gap: 20px;
    align-items: flex-start;
  }

  .diff-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); transform: translateY(-3px); }

  .diff-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(37,99,235,.1), rgba(14,165,233,.1));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
  }

  .diff-text h4 {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 6px;
    letter-spacing: -.3px;
  }

  .diff-text p { font-size: 14px; color: var(--gray-500); line-height: 1.6; }

  /* ===== CTA ===== */
  .cta-section {
    background: linear-gradient(135deg, var(--gray-900), #1e3a5f);
    padding: 100px 0;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .cta-section::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle at 30% 50%, rgba(37,99,235,.15) 0%, transparent 50%),
                radial-gradient(circle at 70% 50%, rgba(14,165,233,.1) 0%, transparent 50%);
  }

  .cta-section .container { position: relative; z-index: 1; }

  .cta-section h2 {
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 900;
    color: var(--white);
    letter-spacing: -1.5px;
    line-height: 1.1;
    margin-bottom: 20px;
  }

  .cta-section h2 span {
    background: linear-gradient(90deg, #60a5fa, #38bdf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .cta-section p {
    font-size: 18px;
    color: rgba(255,255,255,.7);
