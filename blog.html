<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog e Notícias - Fazenda da Esperança Formação</title>
<meta name="description" content="Blog e Notícias da Fazenda da Esperança Formação. Artigos, dicas e novidades sobre nossos cursos online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --secondary: #0ea5e9;
    --secondary-dark: #0284c7;
    --white: #ffffff;
    --gray-50: #f8fafc;
    --gray-100: #f1f5f9;
    --gray-200: #e2e8f0;
    --gray-300: #cbd5e1;
    --gray-400: #94a3b8;
    --gray-500: #64748b;
    --gray-600: #475569;
    --gray-700: #334155;
    --gray-800: #1e293b;
    --gray-900: #0f172a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --shadow-md: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-lg: 16px;
    --transition: all 0.3s ease;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Inter', sans-serif;
    color: var(--gray-800);
    background: var(--gray-50);
    line-height: 1.6;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  .header {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: var(--white);
    box-shadow: var(--shadow);
    transition: var(--transition);
  }
  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
    height: 72px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    flex-shrink: 0;
  }
  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 20px;
    font-weight: 800;
    flex-shrink: 0;
  }
  .logo-text { display: flex; flex-direction: column; }
  .logo-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);
    line-height: 1.2;
  }
  .logo-sub {
    font-size: 11px;
    color: var(--gray-500);
    font-weight: 400;
    line-height: 1.2;
  }
  .nav { display: flex; align-items: center; gap: 4px; }
  .nav a {
    text-decoration: none;
    color: var(--gray-600);
    font-size: 14px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: var(--radius-sm);
    transition: var(--transition);
    white-space: nowrap;
  }
  .nav a:hover, .nav a.active {
    color: var(--primary);
    background: rgba(37,99,235,0.08);
  }
  .header-cta {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white) !important;
    padding: 10px 20px !important;
    border-radius: var(--radius-sm) !important;
    font-weight: 600 !important;
  }
  .header-cta:hover {
    background: linear-gradient(135deg, var(--primary-dark), var(--secondary-dark)) !important;
    color: var(--white) !important;
    transform: translateY(-1px);
    box-shadow: var(--shadow-md) !important;
  }
  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 8px;
    border-radius: var(--radius-sm);
    background: none;
    border: none;
    transition: var(--transition);
  }
  .hamburger:hover { background: var(--gray-100); }
  .hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--gray-700);
    border-radius: 2px;
    transition: var(--transition);
  }
  .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
  .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
  .mobile-menu {
    display: none;
    position: fixed;
    top: 72px;
    left: 0;
    right: 0;
    background: var(--white);
    box-shadow: var(--shadow-lg);
    padding: 16px 24px 24px;
    z-index: 999;
    border-top: 1px solid var(--gray-200);
    animation: slideDown 0.3s ease;
  }
  .mobile-menu.open { display: block; }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .mobile-menu a {
    display: block;
    text-decoration: none;
    color: var(--gray-700);
    font-size: 15px;
    font-weight: 500;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    transition: var(--transition);
    margin-bottom: 4px;
  }
  .mobile-menu a:hover, .mobile-menu a.active {
    color: var(--primary);
    background: rgba(37,99,235,0.08);
  }
  .mobile-menu .mobile-cta {
    display: block;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white) !important;
    text-align: center;
    padding: 14px 20px !important;
    border-radius: var(--radius-sm);
    font-weight: 600;
    margin-top: 12px;
  }

  /* ===== HERO BANNER ===== */
  .page-hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
    padding: 64px 24px;
    text-align: center;
    color: var(--white);
    position: relative;
    overflow: hidden;
  }
  .page-hero::before {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 60%);
    animation: pulse 8s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
  .page-hero-content { position: relative; z-index: 1; max-width: 700px; margin: 0 auto; }
  .page-hero-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--white);
    padding: 6px 16px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 20px;
  }
  .page-hero h1 {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 16px;
  }
  .page-hero p {
    font-size: 16px;
    opacity: 0.9;
    max-width: 500px;
    margin: 0 auto;
  }

  /* ===== MAIN LAYOUT ===== */
  .main-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 24px;
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 40px;
    align-items: start;
  }

  /* ===== FILTER BAR ===== */
  .filter-section { margin-bottom: 32px; }
  .filter-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--gray-600);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }
  .filter-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .filter-tag {
    padding: 7px 16px;
    border-radius: 50px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: 2px solid var(--gray-200);
    background: var(--white);
    color: var(--gray-600);
    transition: var(--transition);
    user-select: none;
  }
  .filter-tag:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .filter-tag.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--white);
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }

  /* ===== SEARCH BAR ===== */
  .search-bar {
    position: relative;
    margin-bottom: 32px;
  }
  .search-bar input {
    width: 100%;
    padding: 14px 48px 14px 18px;
    border: 2px solid var(--gray-200);
    border-radius: var(--radius);
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--gray-800);
    background: var(--white);
    transition: var(--transition);
    outline: none;
  }
  .search-bar input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
  }
  .search-bar input::placeholder { color: var(--gray-400); }
  .search-icon {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gray-400);
    pointer-events: none;
  }

  /* ===== POSTS GRID ===== */
  .posts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
    margin-bottom: 40px;
  }
  .post-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: var(--transition);
    cursor: pointer;
    border: 1px solid var(--gray-200);
    display: flex;
    flex-direction: column;
  }
  .post-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--primary);
  }
  .post-card-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 48px;
    flex-shrink: 0;
  }
  .post-card-body {
    padding: 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .post-card-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .post-category {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .cat-educacao { background: rgba(37,99,235,0.1); color: var(--primary); }
  .cat-tecnologia { background: rgba(14,165,233,0.1); color: var(--secondary-dark); }
  .cat-carreira { background: rgba(16,185,129,0.1); color: #059669; }
  .cat-dicas { background: rgba(245,158,11,0.1); color: #d97706; }
  .cat-novidades { background: rgba(139,92,246,0.1); color: #7c3aed; }
  .post-date {
    font-size: 12px;
    color: var(--gray-400);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .post-card h3 {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);
    line-height: 1.4;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .post-card p {
    font-size: 14px;
    color: var(--gray-500);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
    margin-bottom: 16px;
  }
  .post-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--gray-100);
  }
  .post-author {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .author-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .author-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--gray-600);
  }
  .read-time {
    font-size: 12px;
    color: var(--gray-400);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .read-more-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--primary);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: var(--transition);
    margin-top: 12px;
  }
  .read-more-btn:hover { gap: 10px; }

  /* ===== FEATURED POST ===== */
  .featured-post {
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-md);
    margin-bottom: 32px;
    border: 1px solid var(--gray-200);
    display: grid;
    grid-template-columns: 1fr 1fr;
    cursor: pointer;
    transition: var(--transition);
  }
  .featured-post:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }
  .featured-image {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 80px;
    min-height: 280px;
  }
  .featured-body {
    padding: 32px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .featured-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--white);
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
    width: fit-content;
  }
  .featured-body h2 {
    font-size: 22px;
    font-weight: 800;
    color: var(--gray-900);
    line-height: 1.3;
    margin-bottom: 12px;
  }
  .featured-body p {
    font-size: 14px;
    color: var(--gray-500);
    line-height: 1.7;
    margin-bottom: 20px;
  }

  /* ===== LOADING & EMPTY ===== */
  .loading-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 24px;
  }
  .skeleton-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    overflow: hidden;
    border: 1px solid var(--gray-200);
  }
  .skeleton {
    background: linear-gradient(90deg, var(--gray-200) 25%, var(--gray-100) 50%, var(--gray-200) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
  .skeleton-img { height: 200px; border-radius: 0; }
  .skeleton-body { padding: 20px; }
  .skeleton-line { height: 12px; margin-bottom: 10px; }
  .skeleton-line.short { width: 60%; }
  .skeleton-line.medium { width: 80%; }
  .skeleton-line.full { width: 100%; }
  .skeleton-title { height: 18px; margin-bottom: 8px; }
  .empty-state {
    text-align: center;
    padding: 80px 24px;
    color: var(--gray-400);
  }
  .empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
  .empty-state h3 { font-size: 20px; font-weight: 600; color: var(--gray-600); margin-bottom: 8px; }
  .empty-state p { font-size: 14px; }

  /* ===== PAGINATION ===== */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 16px;
  }
  .page-btn {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--gray-200);
    background: var(--white);
    color: var(--gray-600);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
  }
  .page-btn:hover:not(:disabled) {
    border-color: var(--primary);
    color: var(--primary);
  }
  .page-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--white);
    box-shadow: 0 4px 12px rgba(37,99,235,0.3);
  }
  .page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .page-btn.wide { width: auto; padding: 0 16px; }
  .pagination-info {
    font-size: 13px;
    color: var(--gray-500);
    text-align: center;
    margin-top: 12px;
  }

  /* ===== SIDEBAR ===== */
  .sidebar { position: sticky; top: 88px; display: flex; flex-direction: column; gap: 24px; }
  .sidebar-card {
    background: var(--white);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--gray-200);
  }
  .sidebar-card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--gray-900);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .recent-post-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--gray-100);
    cursor: pointer;
    transition: var(--transition);
  }
  .recent-post-item:last-child { border-bottom: none; padding-bottom: 0; }
  .recent-post-item:first-child { padding-top: 0; }
  .recent-post-item:hover .recent-post-title { color: var(--primary); }
  .recent-post-thumb {
    width: 60px;
    height: 60px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--white);
    font-size: 24px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .recent-post-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .recent-post-info { flex: 1; min-width: 0; }
  .recent-post-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--gray-800);
    line-height: 1.4;
    margin-bottom: 4px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: var(--transition);
  }
  .recent-post-date { font-size: 11px; color: var(--gray-400); }
  .categories-list { display: flex; flex-direction: column; gap: 8px; }
  .category-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    background: var(--gray-50);
    cursor: pointer;
    transition: var(--transition);
    border: 1px solid var(--gray-200);
  }
  .category-item:hover {
    background: rgba(37,99,235,0.05);
    border-color: var(--primary);
  }
  .category-item-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--gray-700);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .category-count {
    background: var(--gray-200);
    color: var(--gray-600);
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 50px;
  }
  .newsletter-card {
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    border-radius: var(--radius-lg);
    padding: 24px;
    color: var(--white);
    text-align: center;
  }
  .newsletter-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
  .newsletter-card p { font-size: 13px; opacity: 0.9; margin-bottom: 16px; line-height: 1.5; }
  .newsletter-input {
    width: 100%;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 10px;
    outline: none;
  }
  .newsletter-btn {
    width: 100%;
    padding: 10px;
    background: rgba(255,255,255,0.2);
    border: 2px solid rgba(255,255,255,0.4);
    border-radius: var(--radius-sm);
    color: var(--white);
    font-size: 13px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: var(--transition);
  }
  .newsletter-btn:hover { background: rgba(255,255,255,0.3); }
  .tags-cloud { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag-item {
    padding: 5px 12px;
    background: var(--gray-100);
    border: 1px solid var(--gray-200);
    border-radius: 50px;
    font-size: 12px;
    color: var(--gray-600);
    cursor: pointer;
    transition: var(--transition);
  }
  .tag-item:hover {
    background: rgba(37,99,235,0.1);
    border-color: var(--primary);
    color: var(--primary);
  }

  /* ===== FOOTER ===== */
  .footer {
    background: var(--gray-900);
    color: var(--gray-300);
    padding: 64px 24px 0;
    margin-top: 80px;
  }
  .footer-grid {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 2fr 1fr 1fr 1fr;
    gap: 48px;
    padding-bottom: 48px;
    border-bottom: 1px solid var(--gray-700);
  }
  .footer-brand .logo-name { color: var(--white); font-size: 18px; }
  .footer-brand .logo-sub { color: var(--gray-400); }
  .footer-desc {
    font-size: 14px;
    color: var(--gray-400);
    line-height: 1.7;
    margin: 16px 0 20px;
  }
  .footer-social { display: flex; gap: 12px; }
  .social-btn {
    width: 36px;
    height: 36px;
    border-radius: var(--radius-sm);
    background: var(--gray-800);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--gray-400);
    text-decoration: none;
    font-size: 16px;
    transition: var(--transition);
    border: 1px solid var(--gray-700);
  }
  .social-btn:hover {
    background: var(--primary);
    color: var(--white);
    border-color: var(--primary);
    transform: translateY(-2px);
  }
