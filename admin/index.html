<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazenda da Esperança Formação - Login Admin</title>
    <style>
        :root {
            --primary-color: #2563eb; /* Cor destaque */
            --background-dark: #1a202c; /* Fundo principal */
            --card-background: #2d3748; /* Fundo do card */
            --text-light: #e2e8f0; /* Texto claro */
            --text-muted: #a0aec0; /* Texto sutil */
            --input-background: #4a5568; /* Fundo do input */
            --border-color: #4a5568; /* Cor da borda */
            --error-color: #ef4444; /* Cor de erro */
        }

        body {
            font-family: 'Inter', sans-serif; /* Uma fonte moderna e limpa */
            background-color: var(--background-dark);
            color: var(--text-light);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .login-card {
            background-color: var(--card-background);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: var(--text-light);
            margin-bottom: 30px;
            font-size: 1.8rem;
            font-weight: 600;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: calc(100% - 24px); /* Ajusta para padding */
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--input-background);
            color: var(--text-light);
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.5); /* Sombra suave com cor destaque */
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #1d5ed1; /* Um pouco mais escuro no hover */
            transform: translateY(-2px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        #erro-login {
            color: var(--error-color);
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--error-color);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            text-align: left;
        }

        /* Responsividade básica */
        @media (max-width: 480px) {
            .login-card {
                padding: 30px 20px;
                margin: 0 15px;
            }
            h1 {
                font-size: 1.6rem;
            }
            input, button {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Login Admin</h1>
        <div id="erro-login" style="display:none;"></div>
        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">

            <label for="password">Senha</label>
            <input type="password" id="password" required autocomplete="current-password">

            <button type="submit">Entrar</button>
        </form>
    </div>

    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'COLE_SUA_URL'; // Substitua pela sua URL do Supabase
        const SUPABASE_KEY = 'COLE_SUA_CHAVE'; // Substitua pela sua chave anon pública do Supabase

        const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const loginForm = document.getElementById('login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const erroLoginDiv = document.getElementById('erro-login');

        // Função para verificar a sessão ao carregar a página
        async function checkSession() {
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                if (error) throw error;

                if (session) {
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                console.error('Erro ao verificar sessão:', error.message);
                // Não exibe erro para o usuário, apenas loga
            }
        }

        // Chama a verificação da sessão ao carregar a página
        checkSession();

        // Event listener para o formulário de login
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Previne o recarregamento da página

            erroLoginDiv.style.display = 'none'; // Esconde mensagens de erro anteriores
            erroLoginDiv.textContent = ''; // Limpa o texto do erro

            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password,
                });

                if (error) {
                    throw error;
                }

                if (data.session) {
                    window.location.href = 'dashboard.html'; // Redireciona em caso de sucesso
                } else {
                    // Isso pode acontecer se signInWithPassword retornar data sem session e sem error (raro)
                    erroLoginDiv.textContent = 'Ocorreu um erro inesperado. Tente novamente.';
                    erroLoginDiv.style.display = 'block';
                }

            } catch (error) {
                console.error('Erro de login:', error.message);
                erroLoginDiv.textContent = `Erro ao fazer login: ${error.message || 'Credenciais inválidas.'}`;
                erroLoginDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
