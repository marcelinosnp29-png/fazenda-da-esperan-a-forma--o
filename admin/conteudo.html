<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestor de Conteúdo - Fazenda da Esperança</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<style>
  :root {
    --primary: #2d6a4f;
    --primary-dark: #1b4332;
    --primary-light: #52b788;
    --primary-lighter: #d8f3dc;
    --accent: #f4a261;
    --accent-dark: #e76f51;
    --sidebar-width: 260px;
    --header-height: 64px;
    --bg: #f0f4f1;
    --surface: #ffffff;
    --surface2: #f8faf9;
    --border: #d1e8d8;
    --text: #1a2e22;
    --text-muted: #6b8f71;
    --text-light: #9dbfa3;
    --danger: #e63946;
    --danger-light: #fde8ea;
    --warning: #f4a261;
    --warning-light: #fef3e8;
    --success: #2d6a4f;
    --success-light: #d8f3dc;
    --info: #457b9d;
    --info-light: #e8f4fd;
    --shadow: 0 2px 8px rgba(45,106,79,0.08);
    --shadow-md: 0 4px 16px rgba(45,106,79,0.12);
    --shadow-lg: 0 8px 32px rgba(45,106,79,0.16);
    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 16px;
    --transition: all 0.2s ease;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
  }

  /* ===== SIDEBAR ===== */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--primary-dark);
    min-height: 100vh;
    position: fixed;
    left: 0; top: 0;
    display: flex;
    flex-direction: column;
    z-index: 100;
    transition: var(--transition);
    overflow: hidden;
  }

  .sidebar-logo {
    padding: 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-logo-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .sidebar-logo-text h2 {
    font-size: 13px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
  }

  .sidebar-logo-text span {
    font-size: 10px;
    color: var(--primary-light);
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sidebar-section {
    padding: 20px 12px 8px;
  }

  .sidebar-section-label {
    font-size: 10px;
    font-weight: 600;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 0 8px;
    margin-bottom: 6px;
  }

  .sidebar-nav { flex: 1; overflow-y: auto; padding-bottom: 20px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    color: rgba(255,255,255,0.65);
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 500;
    border-radius: var(--radius-sm);
    margin: 2px 8px;
    cursor: pointer;
    transition: var(--transition);
    border: none;
    background: none;
    width: calc(100% - 16px);
    text-align: left;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }

  .nav-item.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }

  .nav-item i {
    width: 18px;
    text-align: center;
    font-size: 14px;
    opacity: 0.8;
  }

  .nav-item .badge {
    margin-left: auto;
    background: var(--accent);
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 20px;
    min-width: 20px;
    text-align: center;
  }

  .sidebar-footer {
    padding: 16px;
    border-top: 1px solid rgba(255,255,255,0.1);
  }

  .sidebar-user {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: rgba(255,255,255,0.06);
  }

  .sidebar-user-avatar {
    width: 34px; height: 34px;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    color: #fff;
    font-weight: 700;
    flex-shrink: 0;
  }

  .sidebar-user-info { flex: 1; min-width: 0; }
  .sidebar-user-info strong { font-size: 12px; color: #fff; display: block; }
  .sidebar-user-info span { font-size: 10px; color: rgba(255,255,255,0.45); }

  /* ===== MAIN ===== */
  .main {
    margin-left: var(--sidebar-width);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ===== HEADER ===== */
  .header {
    height: var(--header-height);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
  }

  .header-breadcrumb {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .header-breadcrumb .current {
    color: var(--text);
    font-weight: 600;
  }

  .header-actions { margin-left: auto; display: flex; align-items: center; gap: 12px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: var(--transition);
    text-decoration: none;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); box-shadow: var(--shadow-md); }

  .btn-secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { background: var(--primary-lighter); border-color: var(--primary-light); }

  .btn-danger {
    background: var(--danger-light);
    color: var(--danger);
    border: 1px solid #f5c2c7;
  }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  .btn-success {
    background: var(--success);
    color: #fff;
  }
  .btn-success:hover { background: var(--primary-dark); }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    padding: 8px 12px;
  }
  .btn-ghost:hover { background: var(--surface2); color: var(--text); }

  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-lg { padding: 12px 24px; font-size: 14px; }
  .btn-icon { padding: 8px; width: 36px; height: 36px; justify-content: center; }

  .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

  /* ===== CONTENT ===== */
  .content { flex: 1; padding: 28px; }

  /* ===== VIEWS ===== */
  .view { display: none; }
  .view.active { display: block; }

  /* ===== PAGE HEADER ===== */
  .page-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 16px;
    flex-wrap: wrap;
  }

  .page-title h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }

  .page-title p {
    font-size: 13px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* ===== STATS ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 18px 20px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: var(--shadow);
    transition: var(--transition);
  }

  .stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }

  .stat-icon {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .stat-info { min-width: 0; }
  .stat-value { font-size: 22px; font-weight: 700; color: var(--text); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 3px; font-weight: 500; }

  /* ===== FILTERS ===== */
  .filters-bar {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 16px 20px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    box-shadow: var(--shadow);
  }

  .search-box {
    position: relative;
    flex: 1;
    min-width: 200px;
  }

  .search-box i {
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 13px;
  }

  .search-box input {
    width: 100%;
    padding: 9px 12px 9px 36px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--surface2);
    color: var(--text);
    transition: var(--transition);
    font-family: inherit;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--primary-light);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
  }

  .filter-select {
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    background: var(--surface2);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: var(--transition);
  }

  .filter-select:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
  }

  /* ===== TABLE ===== */
  .table-card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .table-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .table-header h3 { font-size: 14px; font-weight: 600; color: var(--text); }
  .table-header span { font-size: 12px; color: var(--text-muted); }

  .table-wrap { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr { background: var(--surface2); }

  th {
    padding: 12px 16px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  td {
    padding: 14px 16px;
    font-size: 13px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }

  tbody tr:last-child td { border-bottom: none; }

  tbody tr:hover { background: var(--surface2); }

  .post-title-cell {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .post-thumb {
    width: 44px; height: 44px;
    border-radius: 8px;
    object-fit: cover;
    background: var(--primary-lighter);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--primary);
    font-size: 16px;
    overflow: hidden;
  }

  .post-thumb img { width: 100%; height: 100%; object-fit: cover; }

  .post-title-info strong { font-size: 13px; font-weight: 600; display: block; }
  .post-title-info span { font-size: 11px; color: var(--text-muted); }

  .badge-status {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }

  .badge-status::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
  }

  .badge-published { background: var(--success-light); color: var(--success); }
  .badge-published::before { background: var(--success); }
  .badge-draft { background: var(--warning-light); color: #b45309; }
  .badge-draft::before { background: var(--warning); }
  .badge-archived { background: #f1f5f9; color: #64748b; }
  .badge-archived::before { background: #94a3b8; }

  .badge-type {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
  }

  .badge-post { background: var(--info-light); color: var(--info); }
  .badge-page { background: #f3e8ff; color: #7c3aed; }

  .actions-cell { display: flex; align-items: center; gap: 6px; }

  /* ===== EMPTY STATE ===== */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
  }

  .empty-state-icon {
    width: 72px; height: 72px;
    background: var(--primary-lighter);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    color: var(--primary);
    margin: 0 auto 16px;
  }

  .empty-state h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .empty-state p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }

  /* ===== EDITOR VIEW ===== */
  .editor-layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 24px;
    align-items: start;
  }

  .editor-main { display: flex; flex-direction: column; gap: 20px; }
  .editor-sidebar { display: flex; flex-direction: column; gap: 20px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .card-header-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .card-header h3 { font-size: 14px; font-weight: 600; }
  .card-header p { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

  .card-body { padding: 20px; }

  /* ===== FORM ===== */
  .form-group { margin-bottom: 16px; }
  .form-group:last-child { margin-bottom: 0; }

  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .required::after { content: ' *'; color: var(--danger); }

  input[type="text"],
  input[type="url"],
  textarea,
  select {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text);
    background: var(--surface2);
    transition: var(--transition);
    font-family: inherit;
  }

  input[type="text"]:focus,
  input[type="url"]:focus,
  textarea:focus,
  select:focus {
    outline: none;
    border-color: var(--primary-light);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
  }

  textarea { resize: vertical; min-height: 80px; }

  .input-prefix {
    display: flex;
    align-items: center;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    background: var(--surface2);
    transition: var(--transition);
  }

  .input-prefix:focus-within {
    border-color: var(--primary-light);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
  }

  .input-prefix span {
    padding: 10px 12px;
    background: var(--border);
    color: var(--text-muted);
    font-size: 12px;
    white-space: nowrap;
    border-right: 1px solid var(--border);
    font-weight: 500;
  }

  .input-prefix input {
    border: none;
    border-radius: 0;
    background: transparent;
    flex: 1;
    box-shadow: none !important;
  }

  .input-prefix input:focus { outline: none; }

  .char-count {
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    margin-top: 4px;
  }

  .char-count.warning { color: var(--warning); }
  .char-count.danger { color: var(--danger); }

  /* ===== QUILL ===== */
  .quill-wrapper {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    transition: var(--transition);
  }

  .quill-wrapper:focus-within {
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(82,183,136,0.15);
  }

  #editor-container {
    min-height: 320px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }

  .ql-toolbar.ql-snow {
    border: none;
    border-bottom: 1px solid var(--border);
    background: var(--surface2);
    padding: 10px 12px;
  }

  .ql-container.ql-snow {
    border: none;
    font-family: 'Inter', sans-serif;
  }

  .ql-editor { min-height: 280px; padding: 16px; }

  /* ===== IMAGE UPLOAD ===== */
  .image-upload-area {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: var(--transition);
    background: var(--surface2);
    position: relative;
  }

  .image-upload-area:hover {
    border-color: var(--primary-light);
    background: var(--primary-lighter);
  }

  .image-upload-area.has-image {
    padding: 0;
    border-style: solid;
    border-color: var(--primary-light);
  }

  .image-upload-area input[type="file"] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .image-upload-icon { font-size: 28px; color: var(--primary-light); margin-bottom: 8px; }
  .image-upload-text { font-size: 12px; color: var(--text-muted); }
  .image-upload-text strong { color: var(--primary); }

  .image-preview {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    border-radius: calc(var(--radius) - 2px);
    display: none;
  }

  .image-preview.show { display: block; }

  .image-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }

  /* ===== SEO PREVIEW ===== */
  .seo-preview {
    background: var(--surface2);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin-top: 12px;
    border: 1px solid var(--border);
  }

  .seo-preview-url { font-size: 12px; color: #1a73e8; margin-bottom: 3px; }
  .seo-preview-title { font-size: 14px; color: #1a0dab; font-weight: 600; margin-bottom: 3px; line-height: 1.3; }
  .seo-preview-desc { font-size: 12px; color: #545454; line-height: 1.4; }

  /* ===== STATUS TOGGLE ===== */
  .status-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .status-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    cursor: pointer;
    transition: var(--transition);
    background: var(--surface2);
  }

  .status-option:hover { border-color: var(--primary-light); background: var(--primary-lighter); }
  .status-option.selected { border-color: var(--primary); background: var(--primary-lighter); }

  .status-option input { display: none; }

  .status-option-icon {
    width: 30px; height: 30px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
  }

  .status-option-info strong { font-size: 12px; font-weight: 600; display: block; }
  .status-option-info span { font-size: 11px; color: var(--text-muted); }

  /* ===== TOAST ===== */
  .toast-container {
    position: fixed;
    top: 20px; right: 20px;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
  }

  .toast {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-lg);
    border: 1px solid var(--border);
    min-width: 280px;
    max-width: 380px;
    pointer-events: all;
    animation: slideIn 0.3s ease;
    border-left: 4px solid var(--primary);
  }

  .toast.success { border-left-color: var(--success); }
  .toast.error { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warning); }

  .toast-icon { font-size: 18px; flex-shrink: 0; }
  .toast-content { flex: 1; min-width: 0; }
  .toast-title { font-size: 13px; font-weight: 600; }
  .toast-msg { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .toast-close { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 14px; padding: 2px; }
  .toast-close:hover { color: var(--text); }

  @keyframes slideIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  @keyframes slideOut {
    from { transform: translateX(0); opacity: 1; }
    to { transform: translateX(100%); opacity: 0; }
  }

  .toast.removing { animation: slideOut 0.3s ease forwards; }
