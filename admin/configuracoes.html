<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações - Fazenda da Esperança Formação</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --primary: #2d6a4f;
    --primary-dark: #1b4332;
    --primary-light: #52b788;
    --accent: #f4a261;
    --accent-dark: #e76f51;
    --bg: #f0f4f1;
    --sidebar-bg: #1b4332;
    --sidebar-text: #d8f3dc;
    --sidebar-active: #2d6a4f;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-muted: #6c757d;
    --border: #dee2e6;
    --success: #40916c;
    --error: #d62828;
    --warning: #f4a261;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
  }

  /* SIDEBAR */
  .sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    z-index: 100;
    transition: transform 0.3s ease;
  }

  .sidebar-logo {
    padding: 24px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sidebar-logo .logo-icon {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--primary-light), var(--accent));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .sidebar-logo .logo-text {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    color: #fff;
  }

  .sidebar-logo .logo-sub {
    font-size: 10px;
    color: var(--primary-light);
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .sidebar-nav {
    flex: 1;
    padding: 16px 0;
    overflow-y: auto;
  }

  .nav-section-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.4);
    padding: 12px 20px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 20px;
    cursor: pointer;
    transition: all 0.2s;
    border-left: 3px solid transparent;
    color: var(--sidebar-text);
    text-decoration: none;
    font-size: 14px;
  }

  .nav-item:hover {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }

  .nav-item.active {
    background: rgba(255,255,255,0.12);
    border-left-color: var(--primary-light);
    color: #fff;
  }

  .nav-item .nav-icon { font-size: 16px; width: 20px; text-align: center; }

  .sidebar-footer {
    padding: 16px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    font-size: 12px;
    color: rgba(255,255,255,0.4);
  }

  /* MAIN */
  .main {
    margin-left: 260px;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  .topbar {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .topbar-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--primary-dark);
  }

  .topbar-badge {
    background: var(--primary-light);
    color: #fff;
    font-size: 10px;
    padding: 2px 8px;
    border-radius: 20px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }

  .btn-outline {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text-muted);
  }

  .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

  .btn-danger {
    background: var(--error);
    color: #fff;
  }

  .btn-danger:hover { background: #b71c1c; }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
  }

  /* CONTENT */
  .content {
    padding: 32px;
    flex: 1;
  }

  /* TABS */
  .tabs-wrapper {
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .tabs-header {
    display: flex;
    border-bottom: 2px solid var(--border);
    background: #f8faf9;
    overflow-x: auto;
  }

  .tab-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 22px;
    cursor: pointer;
    border: none;
    background: transparent;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.2s;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
  }

  .tab-btn:hover { color: var(--primary); background: rgba(45,106,79,0.05); }

  .tab-btn.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
    background: #fff;
    font-weight: 600;
  }

  .tab-btn .tab-icon { font-size: 16px; }

  .tabs-body { padding: 32px; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* FORM ELEMENTS */
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .form-grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 20px;
  }

  .form-full { grid-column: 1 / -1; }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .form-label .label-badge {
    font-size: 10px;
    background: var(--accent);
    color: #fff;
    padding: 1px 6px;
    border-radius: 4px;
    font-weight: 500;
  }

  .form-input, .form-select, .form-textarea {
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text);
    background: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
    font-family: inherit;
  }

  .form-input:focus, .form-select:focus, .form-textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(45,106,79,0.12);
  }

  .form-textarea { resize: vertical; min-height: 90px; }

  .form-hint {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* SECTION DIVIDER */
  .section-divider {
    margin: 28px 0 20px;
    padding-bottom: 10px;
    border-bottom: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-divider h3 {
    font-size: 15px;
    font-weight: 700;
    color: var(--primary-dark);
  }

  .section-divider .divider-icon { font-size: 18px; }

  /* SOCIAL CARD */
  .social-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .social-card {
    background: #f8faf9;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: border-color 0.2s;
  }

  .social-card:hover { border-color: var(--primary-light); }

  .social-icon {
    width: 42px; height: 42px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .social-icon.facebook { background: #e8f0fe; }
  .social-icon.instagram { background: #fce4ec; }
  .social-icon.youtube { background: #ffebee; }
  .social-icon.twitter { background: #e3f2fd; }
  .social-icon.linkedin { background: #e8f5e9; }
  .social-icon.tiktok { background: #f3e5f5; }
  .social-icon.whatsapp { background: #e8f5e9; }
  .social-icon.telegram { background: #e3f2fd; }

  .social-input-wrap { flex: 1; }
  .social-name { font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 4px; }

  /* SEO PREVIEW */
  .seo-preview {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-top: 16px;
  }

  .seo-preview-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .seo-google-preview {
    font-family: Arial, sans-serif;
    max-width: 600px;
  }

  .seo-google-url {
    font-size: 12px;
    color: #006621;
    margin-bottom: 2px;
  }

  .seo-google-title {
    font-size: 18px;
    color: #1a0dab;
    margin-bottom: 4px;
    cursor: pointer;
  }

  .seo-google-title:hover { text-decoration: underline; }

  .seo-google-desc {
    font-size: 13px;
    color: #545454;
    line-height: 1.5;
  }

  /* INTEGRATION CARDS */
  .integration-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .integration-card {
    background: #f8faf9;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .integration-card:hover {
    border-color: var(--primary-light);
    box-shadow: 0 4px 16px rgba(45,106,79,0.1);
  }

  .integration-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .integration-info {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .integration-logo {
    width: 44px; height: 44px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }

  .int-ga { background: #fff3e0; }
  .int-pixel { background: #e8eaf6; }
  .int-wa { background: #e8f5e9; }
  .int-recaptcha { background: #fce4ec; }

  .integration-name { font-size: 15px; font-weight: 700; color: var(--text); }
  .integration-desc { font-size: 12px; color: var(--text-muted); }

  /* TOGGLE */
  .toggle-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .toggle {
    position: relative;
    width: 44px; height: 24px;
    cursor: pointer;
  }

  .toggle input { opacity: 0; width: 0; height: 0; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: #ccc;
    border-radius: 24px;
    transition: 0.3s;
  }

  .toggle-slider:before {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; bottom: 3px;
    background: #fff;
    border-radius: 50%;
    transition: 0.3s;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
  }

  .toggle input:checked + .toggle-slider { background: var(--primary); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(20px); }

  .toggle-label { font-size: 13px; font-weight: 500; color: var(--text-muted); }

  /* COLOR PICKER */
  .color-section {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .color-card {
    background: #f8faf9;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s;
  }

  .color-card:hover { border-color: var(--primary-light); }

  .color-picker-wrap {
    position: relative;
    width: 44px; height: 44px;
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    flex-shrink: 0;
  }

  .color-picker-wrap input[type="color"] {
    position: absolute;
    inset: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    border: none;
    cursor: pointer;
    padding: 0;
  }

  .color-info { flex: 1; }
  .color-name { font-size: 12px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
  .color-value { font-size: 11px; color: var(--text-muted); font-family: monospace; }

  /* THEME PREVIEW */
  .theme-preview {
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    margin-top: 8px;
  }

  .preview-topbar {
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
  }

  .preview-logo-dot {
    width: 28px; height: 28px;
    border-radius: 6px;
  }

  .preview-logo-text {
    height: 12px;
    width: 120px;
    border-radius: 4px;
    opacity: 0.7;
  }

  .preview-nav-items {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }

  .preview-nav-item {
    height: 10px;
    width: 50px;
    border-radius: 4px;
    opacity: 0.5;
  }

  .preview-body {
    display: flex;
    height: 160px;
  }

  .preview-sidebar {
    width: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 12px 0;
    gap: 8px;
  }

  .preview-sidebar-item {
    width: 36px; height: 8px;
    border-radius: 4px;
    opacity: 0.4;
  }

  .preview-sidebar-item.active { opacity: 1; }

  .preview-main {
    flex: 1;
    padding: 16px;
    background: #f8faf9;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .preview-card {
    background: #fff;
    border-radius: 8px;
    height: 40px;
    padding: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }

  .preview-card-dot {
    width: 20px; height: 20px;
    border-radius: 4px;
  }

  .preview-card-line {
    height: 8px;
    border-radius: 4px;
    flex: 1;
    opacity: 0.3;
  }

  .preview-btn-demo {
    height: 28px;
    width: 70px;
    border-radius: 6px;
    margin-left: auto;
  }

  /* FONT SELECTOR */
  .font-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .font-option {
    border: 2px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }

  .font-option:hover { border-color: var(--primary-light); }
  .font-option.selected { border-color: var(--primary); background: rgba(45,106,79,0.05); }

  .font-sample { font-size: 22px; margin-bottom: 4px; }
  .font-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }

  /* ALERT */
  .alert {
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .alert-success { background: #d8f3dc; color: #1b4332; border: 1px solid #b7e4c7; }
  .alert-error { background: #ffebee; color: #b71c1c; border: 1px solid #ffcdd2; }
  .alert-info { background: #e3f2fd; color: #0d47a1; border: 1px solid #bbdefb; }

  /* LOADING */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    backdrop-filter: blur(4px);
  }

  .loading-spinner {
    width: 48px; height: 48px;
    border: 4px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    margin-top: 12px;
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .loading-wrap { display: flex; flex-direction: column; align-items: center; }

  /* SAVE BAR */
  .save-bar {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    z-index: 200;
    transform: translateY(100px);
    opacity: 0;
    transition: all 0.3s ease;
  }

  .save-bar.visible { transform: translateY(0); opacity: 1; }

  .save-bar-text { font-size: 13px; color: var(--text-muted); }
  .save-bar-dot { width: 8px; height: 8px; background: var(--warning); border-radius: 50%; }

  /* CHAR COUNTER */
  .char-counter {
    font-size: 11px;
    color: var(--text-muted);
    text-align: right;
    margin-top: 2px;
  }

  .char-counter.warn { color: var(--warning); }
  .char-counter.over { color: var(--error); }

  /* UPLOAD AREA */
  .upload-area {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: #fafafa;
  }

  .upload-area:hover { border-color: var(--primary); background: rgba(45,106,79,0.03); }
  .upload-area.dragover { border-color: var(--primary); background: rgba(45,106,79,0.08); }

  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-text { font-size: 14px; color: var(--text-muted); }
  .upload-hint { font-size: 12px; color: var(--text-muted); opacity: 0.7; margin-top: 4px; }

  .logo-preview {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px;
    background: #f0f4f1;
    border-radius: 8px;
    margin-top: 8px;
  }

  .logo-preview img {
    width: 60px; height: 60px;
    object-fit: contain;
    border-radius: 8px;
    background: #fff;
    padding: 4px;
  }

  .logo-preview-info { flex: 1; }
  .logo-preview-name { font-size: 13px; font-weight: 600; }
  .logo-preview-size { font-size: 11px; color: var(--text-muted); }

  /* BADGE STATUS */
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 20px;
  }

  .status-active { background: #d8f3dc; color: #1b4332; }
  .status-inactive { background: #f5f5f5; color: #9e9e9e; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .form-grid, .form-grid-3, .social-grid, .integration-grid { grid-template-columns: 1fr; }
    .font-grid { grid-template-columns: 1fr 1fr; }
    .color-section { grid-template-columns: 1fr 1fr; }
    .content { padding: 16px; }
    .tabs-body { padding: 20px; }
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--text);
    padding: 4px;
  }

  @media (max-width: 900px) { .hamburger { display: block; } }

  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 99;
  }

  .sidebar-overlay.show { display: block; }
</style>
</head>
<body>

<!-- Loading -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-wrap">
    <div class="loading-spinner"></div>
    <div class="loading-text">Carregando configurações...</div>
  </div>
</div>

<!-- Sidebar Overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-logo">
